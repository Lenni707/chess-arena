[package]
name = "arena-core"
version = "0.1.0"
edition = "2024"
description = "Chess rules for Chess Arena (shakmaty compiled to WebAssembly)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shakmaty = { version = "0.30", default-features = false, features = ["std"] }
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
